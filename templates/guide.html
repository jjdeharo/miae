<section class="guide-section" id="guia" aria-labelledby="guia-title">
  <p class="eyebrow">MIAE · {{ guide.start }}</p>
  <h2 id="guia-title">{{ guide.guide_title }}</h2>
  <p class="section-intro">{{ guide.guide_intro }}</p>
  <ol class="guide-steps">{% for title, text in guide.steps %}<li><h3>{{ title }}</h3><p>{{ text }}</p></li>{% endfor %}</ol>
  <p class="principle">{{ guide.principle }}</p>
</section>
